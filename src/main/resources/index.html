<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Number</title>
<style>
  :root{
    --bg:#0b1020; --card:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.12);
    --text:#eaf0ff; --muted:#93a0c0; --accent:#6d8bff; --cold:#5ec8ff;
    --hot:#ff9f43; --win:#4ade80; --err:#ff7a7a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:grid; place-items:center; padding:1.5rem;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif; color:var(--text);
    background:
      radial-gradient(900px 500px at 15% -10%, #24306b 0%, transparent 60%),
      radial-gradient(800px 500px at 110% 110%, #4b1f5e 0%, transparent 55%),
      var(--bg);
  }
  .card{
    width:min(94vw,440px); padding:2rem; border-radius:22px; text-align:center;
    background:var(--card); border:1px solid var(--stroke); backdrop-filter:blur(14px);
    box-shadow:0 24px 60px rgba(0,0,0,.5);
    animation:rise .5s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .badge{
    display:inline-block; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--stroke); border-radius:999px; padding:.3rem .7rem;
  }
  h1{margin:.9rem 0 .3rem; font-size:1.75rem; letter-spacing:-.02em}
  .sub{margin:0; color:var(--muted); font-size:.9rem}

  .meter{height:8px; border-radius:999px; margin:1.5rem 0 .4rem;
    background:linear-gradient(90deg,var(--cold),#7c5cff,var(--hot)); opacity:.3}
  .range{display:flex; justify-content:space-between; color:var(--muted); font-size:.78rem;
    font-variant-numeric:tabular-nums}
  .range b{color:var(--text); font-weight:600}

  form{display:flex; gap:.6rem; justify-content:center; margin:1.4rem 0 .2rem}
  input{
    flex:1; max-width:9rem; font:600 1.25rem/1 inherit; text-align:center; color:var(--text);
    background:rgba(0,0,0,.35); border:1px solid var(--stroke); border-radius:12px; padding:.75rem;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  input:focus{border-color:var(--accent); box-shadow:0 0 0 4px rgba(109,139,255,.18)}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  button{
    font:600 1rem/1 inherit; color:#fff; cursor:pointer; border:none; border-radius:12px;
    padding:.75rem 1.25rem; background:linear-gradient(135deg,#6d8bff,#8b5cf6);
    transition:transform .15s, filter .15s;
  }
  button:hover{filter:brightness(1.1)} button:active{transform:scale(.97)}
  button:disabled{opacity:.5; cursor:not-allowed}

  #message{margin:1.3rem 0 .3rem; min-height:1.6rem; font-size:1.05rem; font-weight:600}
  #message.low{color:var(--hot)} #message.high{color:var(--cold)}
  #message.win{color:var(--win)} #message.err{color:var(--err)}
  #message.pulse{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}

  .stats{display:flex; justify-content:center; gap:1.75rem; color:var(--muted); font-size:.78rem;
    font-variant-numeric:tabular-nums}
  .stats b{display:block; color:var(--text); font-size:1.1rem; font-weight:700}

  .history{display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; margin-top:1.1rem; min-height:1.9rem}
  .chip{font-size:.8rem; font-weight:600; padding:.3rem .6rem; border-radius:999px;
    border:1px solid var(--stroke); background:rgba(0,0,0,.25); animation:pop .3s ease}
  .chip.low{color:var(--hot)} .chip.high{color:var(--cold)} .chip.win{color:var(--win)}

  #reset{margin-top:1.4rem; background:transparent; border:1px solid var(--stroke); color:var(--muted)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="card" id="card">
  <span class="badge">Java &middot; Docker &middot; CI</span>
  <h1>Guess the Number</h1>
  <p class="sub">I picked a secret number. Can you find it?</p>

  <div class="meter"></div>
  <div class="range"><span>Low <b id="lo">1</b></span><span>High <b id="hi">100</b></span></div>

  <form id="form" autocomplete="off">
    <input id="value" type="number" min="1" max="100" placeholder="?" required>
    <button type="submit" id="submit">Guess</button>
  </form>

  <div id="message">Take your first guess</div>
  <div class="stats">
    <span>Attempts<b id="attempts">0</b></span>
    <span>Best<b id="best">&ndash;</b></span>
  </div>
  <div class="history" id="history"></div>

  <button id="reset" type="button">New game</button>
</div>

<script>
  const el = id => document.getElementById(id);
  const card = el('card'), msg = el('message'), input = el('value');
  const history = el('history'), lo = el('lo'), hi = el('hi');
  let gameId = null, low = 1, high = 100;

  const best = () => localStorage.getItem('gtn-best');
  el('best').textContent = best() || '\u2013';

  function say(text, cls){
    msg.textContent = text;
    msg.className = (cls || '') + ' pulse';
    setTimeout(() => msg.classList.remove('pulse'), 350);
  }

  function bounds(){ lo.textContent = low; hi.textContent = high; }

  async function newGame(){
    const res = await fetch('/api/new', { method: 'POST' });
    const data = await res.json();
    gameId = data.id; low = 1; high = data.max;
    bounds();
    history.innerHTML = '';
    el('attempts').textContent = '0';
    input.value = ''; input.disabled = false; el('submit').disabled = false;
    say('Take your first guess');
    input.focus();
  }

  function chip(value, cls, mark){
    const span = document.createElement('span');
    span.className = 'chip ' + cls;
    span.textContent = value + ' ' + mark;
    history.prepend(span);
  }

  el('form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!gameId) return newGame();
    const value = input.value;
    const res = await fetch('/api/guess?id=' + encodeURIComponent(gameId) +
                            '&value=' + encodeURIComponent(value));
    const data = await res.json();

    if (data.error){
      say(data.error, 'err');
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 350);
      return;
    }

    el('attempts').textContent = data.attempts;
    const n = Number(value);

    if (data.result === 'TOO_LOW'){
      low = Math.max(low, n + 1); bounds();
      say('Too low \u2014 aim higher', 'low');
      chip(n, 'low', '\u2191');
    } else if (data.result === 'TOO_HIGH'){
      high = Math.min(high, n - 1); bounds();
      say('Too high \u2014 aim lower', 'high');
      chip(n, 'high', '\u2193');
    } else {
      say('Correct! Solved in ' + data.attempts + ' guesses', 'win');
      chip(n, 'win', '\u2713');
      gameId = null;
      input.disabled = true; el('submit').disabled = true;
      const record = best();
      if (!record || data.attempts < Number(record)){
        localStorage.setItem('gtn-best', data.attempts);
        el('best').textContent = data.attempts;
      }
      return;
    }
    input.value = ''; input.focus();
  });

  el('reset').addEventListener('click', newGame);
  newGame();
</script>
</body>
</html>
